{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Catálogo{% endblock %} · FreeLibrary</title>
  <link rel="stylesheet" href="{% static 'catalog/css/catalog.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="cabecera">
    <div class="ancho barra">
      <a class="marca" href="{% url 'home' %}">FreeLibrary</a>
      <nav aria-label="Navegación principal">
        <a href="{% url 'home' %}">Inicio</a>
        <a href="{% url 'catalog:list' %}"{% block estado_catalogo %}{% endblock %}>Catálogo</a>
      </nav>
    </div>
  </header>
  <main class="ancho contenido">
    {% block content %}{% endblock %}
  </main>
  <footer class="pie"><div class="ancho">FreeLibrary · Biblioteca digital</div></footer>
</body>
</html>
