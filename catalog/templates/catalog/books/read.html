{% extends 'catalog/base.html' %}
{% block title %}Leer {{ libro.title }}{% endblock %}
{% block content %}
  <a class="enlace regreso" href="{% url 'catalog:token' libro.slug %}">← Volver a la ficha</a>
  <div class="cabecera-lector">
    <h1>{{ libro.title }}</h1>
    <a class="boton" href="{{ pdfUrl }}" target="_blank" rel="noopener">Abrir PDF en otra pestaña</a>
  </div>
  <object class="visor" data="{{ pdfUrl }}" type="application/pdf" aria-label="PDF de {{ libro.title }}">
    <p>El visor integrado no está disponible. Usa el enlace para abrir el PDF en otra pestaña.</p>
  </object>
{% endblock %}
