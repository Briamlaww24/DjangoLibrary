<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | FreeLibrary</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'home/css/accounts.css' %}">
</head>
<body>
  <main class="cuenta cuenta--login">
    <section class="panel-formulario" aria-labelledby="titulo-login">
      <div class="contenido">
        <a class="marca" href="{% url 'home' %}">FreeLibrary</a>

        <h1 id="titulo-login">Inicia sesión</h1>
        <p class="intro">Vuelve a tu biblioteca y sigue descubriendo clásicos.</p>

        <form method="post">
          {% csrf_token %}
          {{ form.non_field_errors }}

          <div class="campo">
            <label for="id_username">Nombre de usuario</label>
            {{ form.username.errors }}
            <input id="id_username" name="username" type="text"
                   autocomplete="username" value="{{ form.username.value|default_if_none:'' }}"
                   required>
          </div>

          <div class="campo">
            <label for="id_password">Contraseña</label>
            {{ form.password.errors }}
            <input id="id_password" name="password" type="password"
                   autocomplete="current-password" required>
          </div>

          {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
          {% endif %}

          <button type="submit">Iniciar sesión</button>
        </form>

        <p class="alternativa">¿Aún no tienes cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
      </div>
    </section>

    <aside class="panel-visual">
      <img src="{% static 'home/images/biblioteca.jpg' %}" alt="">
      <p>Siempre hay otro libro por descubrir.</p>
    </aside>
  </main>
</body>
</html>
