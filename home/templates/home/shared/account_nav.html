{% if user.is_authenticated %}
  <a href="{% url 'profile' %}"{% if section == 'profile' %} aria-current="page"{% endif %}>{{ user.get_full_name|default:user.get_username }}</a>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button class="salir-nav" type="submit">Cerrar sesión</button>
  </form>
{% else %}
  <a href="{% url 'login' %}">Iniciar sesión</a>
  <a class="register-link" href="{% url 'register' %}">Registrarse</a>
{% endif %}
