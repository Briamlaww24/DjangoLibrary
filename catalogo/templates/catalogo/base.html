{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Catálogo{% endblock %} · Librería Abierta</title>
  <link rel="stylesheet" href="{% static 'catalogo/css/catalogo.css' %}">
</head>
<body>
  <header class="cabecera">
    <div class="ancho barra">
      <a class="marca" href="/">Librería Abierta</a>
      <nav aria-label="Navegación principal">
        <a href="/">Inicio</a>
        <a href="{% url 'catalogo:lista' %}"{% block estado_catalogo %}{% endblock %}>Catálogo</a>
      </nav>
    </div>
  </header>
  <main class="ancho contenido">
    {% block content %}{% endblock %}
  </main>
  <footer class="pie"><div class="ancho">Librería Abierta · Biblioteca digital</div></footer>
</body>
</html>
