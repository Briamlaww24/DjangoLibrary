{% extends 'catalogo/base.html' %}
{% block title %}Leer {{ libro.titulo }}{% endblock %}
{% block content %}
  <a class="enlace regreso" href="{% url 'catalogo:ficha' libro.slug %}">← Volver a la ficha</a>
  <div class="cabecera-lector">
    <h1>{{ libro.titulo }}</h1>
    <a class="boton" href="{{ pdf_url }}" target="_blank" rel="noopener">Abrir PDF en otra pestaña</a>
  </div>
  <object class="visor" data="{{ pdf_url }}" type="application/pdf" aria-label="PDF de {{ libro.titulo }}">
    <p>El visor integrado no está disponible. Usa el enlace para abrir el PDF en otra pestaña.</p>
  </object>
{% endblock %}
